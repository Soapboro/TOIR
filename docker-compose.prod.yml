services:

  # ── PostgreSQL ───────────────────────────────────────────────────────────────
  db:
    image: postgres:15-alpine
    container_name: toir_db_prod
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${DB_NAME}
      POSTGRES_USER:     ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ── Django + Gunicorn ────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    image: toir_backend:prod
    container_name: toir_backend_prod
    restart: unless-stopped
    env_file: .env.prod
    environment:
      DB_HOST: db
      DEBUG:   "False"
    volumes:
      - static_files:/app/staticfiles
      - media_files:/app/media
    networks:
      - internal
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/api/schema/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

  # ── React SPA (nginx) ─────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    image: toir_frontend:prod
    container_name: toir_frontend_prod
    restart: unless-stopped
    networks:
      - internal
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ── Nginx reverse proxy + SSL ────────────────────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: toir_nginx_prod
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN_NAME:                   ${DOMAIN_NAME}
      # Ограничиваем envsubst только нашей переменной,
      # чтобы nginx-переменные ($host и др.) не затронулись
      NGINX_ENVSUBST_TEMPLATE_VARS:  DOMAIN_NAME
    volumes:
      - ./nginx/templates:/etc/nginx/templates:ro
      - ./nginx/snippets:/etc/nginx/snippets:ro
      - static_files:/app/staticfiles:ro
      - media_files:/app/media:ro
      - certbot_conf:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
    networks:
      - internal
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ── Certbot (Let's Encrypt) ───────────────────────────────────────────────────
  certbot:
    image: certbot/certbot:latest
    container_name: toir_certbot
    restart: unless-stopped
    volumes:
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    # Обновляем сертификат каждые 12 часов (certbot пропускает, если до истечения > 30 дней)
    entrypoint: >
      /bin/sh -c "trap exit TERM;
        while :; do
          certbot renew --quiet --webroot -w /var/www/certbot;
          sleep 12h & wait $${!};
        done"
    healthcheck:
      test: ["CMD", "certbot", "certificates"]
      interval: 12h
      timeout: 30s
      retries: 1
      start_period: 5s


volumes:
  postgres_data:
    driver: local
  static_files:
    driver: local
  media_files:
    driver: local
  certbot_conf:
    driver: local
  certbot_www:
    driver: local


networks:
  internal:
    driver: bridge
